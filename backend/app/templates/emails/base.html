<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simple Project Tool{% endblock %}</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; max-width: 520px; margin: 0 auto; padding: 40px 20px; color: #1c1917; background: #ffffff;">
  <p style="font-weight: 600; font-size: 15px; margin: 0 0 32px;">Simple Project Tool</p>
  {% block content %}{% endblock %}
  <p style="margin-top: 40px; font-size: 11px; color: #a8a29e; border-top: 1px solid #e7e5e4; padding-top: 16px;">This email was sent automatically. Please do not reply.</p>
</body>
</html>
