version: 2
updates:
  # "uv", not "pip": pip only edits pyproject.toml and leaves uv.lock stale, which
  # breaks Railway's `uv sync --locked` build.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7  
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7  
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
