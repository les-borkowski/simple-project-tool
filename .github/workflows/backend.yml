name: Backend CI

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Lint with ruff
        run: cd backend && uv run ruff check . && uv run ruff format --check .

      - name: Run tests with coverage
        env:
          # Throwaway values for the ephemeral Postgres service container above.
          # Settings (app/core/config.py) has no defaults for SYNC_DATABASE_URL,
          # SECRET_KEY, ADMIN_USERNAME, ADMIN_PASSWORD or ADMIN_SECRET, so pytest
          # cannot even import conftest without them. This step had never run
          # before — the ruff gate above it always failed first — so the gap was
          # invisible until now.
          # The async URLs need the +asyncpg driver: create_async_engine rejects
          # a bare postgresql:// URL. conftest reads TEST_DATABASE_URL, not
          # DATABASE_URL, and derives its own sync URL from it.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: ci-only-not-a-real-secret
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password
          ADMIN_SECRET: ci-admin-secret
        run: cd backend && uv run pytest --cov=app --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/.coverage
          flags: backend
          fail_ci_if_error: false
