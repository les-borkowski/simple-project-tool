name: Frontend CI

# No `paths:` filters: `test` and `lint-and-build` are required status checks on
# main, and GitHub blocks a PR until every required check reports. A filtered
# workflow simply never reports on a PR that misses its paths, leaving it stuck on
# "Expected — waiting for status" forever. Re-adding a filter here re-breaks merges.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom 30 needs ^20.19 || ^22.13 || >=24 and vite 8 needs
          # ^20.19 || >=22.12, and Node 20 went EOL in April 2026. On 20 the suite
          # dies before it starts — undici's CacheStorage hits
          # `webidl.util.markAsUncloneable is not a function`.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint with ESLint
        run: cd frontend && npm run lint

      - name: Build verification
        run: cd frontend && npm run build

      # Runs last because it is by far the slowest step, and a type error surfaces
      # more clearly from the build above than as a cascade of failing renders.
      - name: Tests
        run: cd frontend && npm test
