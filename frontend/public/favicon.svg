<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Simple Project Tool">
  <!-- Board columns at descending fill: the app's signature view, and the one
       shape that still reads as "a board" at 16px, where separate cards blur
       into a smudge. Bars are 6 wide on a 32 grid with 5 of padding — thinner
       than that and the tab icon turns to mush. Indigo is the default accent
       (see ACCENTS in components/layout/ThemeStyle.tsx). -->
  <rect width="32" height="32" rx="7" fill="#6366f1"/>
  <g fill="#fff">
    <rect x="5"  y="6" width="6" height="20" rx="3"/>
    <rect x="13" y="6" width="6" height="15" rx="3"/>
    <rect x="21" y="6" width="6" height="10" rx="3"/>
  </g>
</svg>
