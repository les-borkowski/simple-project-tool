<style>
  html, body { font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .font-serif { font-family: 'Instrument Serif', serif; }
  /* Tokens — exposed as CSS vars per theme/variation */
  :root {
    /* status spectrum (warm-cool perceptual) */
    --st-todo:  #94a3b8;  /* slate-400 */
    --st-prog:  #6366f1;  /* indigo */
    --st-rev:   #d97706;  /* amber-600 */
    --st-test:  #db2777;  /* pink-600 */
    --st-done:  #059669;  /* emerald-600 */
    --pr-low:   #94a3b8;
    --pr-med:   #d97706;
    --pr-high:  #dc2626;
    --accent:   #6366f1;  /* indigo primary */
    --accent-soft: #eef2ff;
  }
  .dark { --accent-soft: #1e1b4b; }
  /* status pill — open ring style */
  .st-pill { display:inline-flex; align-items:center; gap:.4rem; font-size:11px; font-weight:500; line-height:1; padding:3px 8px 3px 6px; border-radius: 999px; }
  .st-pill .dot { width:6px; height:6px; border-radius:999px; background: currentColor; flex:none; }
  .st-todo  { color: var(--st-todo);  background: color-mix(in oklab, var(--st-todo) 12%, transparent); }
  .st-prog  { color: var(--st-prog);  background: color-mix(in oklab, var(--st-prog) 12%, transparent); }
  .st-rev   { color: var(--st-rev);   background: color-mix(in oklab, var(--st-rev)  14%, transparent); }
  .st-test  { color: var(--st-test);  background: color-mix(in oklab, var(--st-test) 12%, transparent); }
  .st-done  { color: var(--st-done);  background: color-mix(in oklab, var(--st-done) 14%, transparent); }
  .pr-low   { color: var(--pr-low); }
  .pr-med   { color: var(--pr-med); }
  .pr-high  { color: var(--pr-high); }
  /* priority bars (tiny vertical bars, like Linear) */
  .pr-bars { display:inline-flex; align-items:flex-end; gap:1.5px; height:10px; }
  .pr-bars span { width:2.5px; background: currentColor; border-radius: 1px; opacity: .25; }
  .pr-bars[data-level="1"] span:nth-child(1){opacity:1}
  .pr-bars[data-level="2"] span:nth-child(-n+2){opacity:1}
  .pr-bars[data-level="3"] span{opacity:1}
  .pr-bars span:nth-child(1){height:30%}
  .pr-bars span:nth-child(2){height:65%}
  .pr-bars span:nth-child(3){height:100%}
  /* hide scrollbar for board columns wrapper but keep scroll */
  .scroll-hidden::-webkit-scrollbar { display: none; }
  .scroll-hidden { scrollbar-width: none; }
  /* avatar gradient backgrounds */
  .av-1 { background: linear-gradient(135deg,#fb7185,#f59e0b); }
  .av-2 { background: linear-gradient(135deg,#6366f1,#8b5cf6); }
  .av-3 { background: linear-gradient(135deg,#10b981,#06b6d4); }
  .av-4 { background: linear-gradient(135deg,#f43f5e,#a855f7); }
  .av-5 { background: linear-gradient(135deg,#0ea5e9,#22d3ee); }
  .av-6 { background: linear-gradient(135deg,#84cc16,#facc15); }
  /* fine grid for board background in variation B */
  .fine-grid {
    background-image: linear-gradient(to right, rgba(0,0,0,.04) 1px, transparent 1px);
    background-size: 280px 100%;
  }
  .dark .fine-grid {
    background-image: linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px);
  }
  /* kbd */
  kbd {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding: 0 5px;
    font-family: 'Geist Mono', monospace; font-size: 10.5px;
    border-radius: 4px;
    background: rgba(0,0,0,.05); color: rgba(0,0,0,.55);
    border: 1px solid rgba(0,0,0,.06);
    line-height:1;
  }
  .dark kbd { background: rgba(255,255,255,.06); color: rgba(255,255,255,.6); border-color: rgba(255,255,255,.08); }
  /* shimmer for current state indicator */
  @keyframes pulse-soft { 0%,100% { opacity: .9 } 50% { opacity: .45 } }
  .pulse-soft { animation: pulse-soft 1.8s ease-in-out infinite; }
  /* card hover lift */
  .lift { transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .lift:hover { transform: translateY(-1px); }
  /* drag handle dots */
  .drag-handle {
    background-image: radial-gradient(currentColor 1px, transparent 1px);
    background-size: 4px 4px;
    background-position: 0 0, 2px 2px;
  }
  /* scoped frame — both variations live in their own theme container */
  .frame { container-type: inline-size; }
</style>

  { id:'p1', key:'ORB', name:'Orbit Mobile App',  desc:'Q2 launch — iOS + Android',  status:'in_progress', priority:'high',  members:[PEOPLE[0],PEOPLE[1],PEOPLE[2],PEOPLE[3],PEOPLE[4]], stories:18, openTasks:42, updated:'2h' },

const COMMENTS = [

/* =========================================================================
   PRIMITIVES
========================================================================= */
function StatusPill({ id, size='sm' }) {
  const s = ST_BY_ID[id] || ST_BY_ID.to_do;
  return (
    <span className={`st-pill ${s.cls}`} style={{fontSize: size==='lg'?12:11}}>
      <span className="dot" />
      {s.label}
    </span>
  );
}
function PriorityBars({ id, withLabel }) {
  const p = PR_BY_ID[id]; if (!p) return null;
  return (
    <span className={`inline-flex items-center gap-1.5 ${p.cls}`}>
      <span className="pr-bars" data-level={p.level}><span/><span/><span/></span>
      {withLabel && <span className="text-[11px] font-medium">{p.label}</span>}
    </span>
  );
}
function Avatar({ p, size=22, ring }) {
  if (!p) return <span style={{width:size,height:size}} className="inline-flex items-center justify-center rounded-full border border-dashed border-stone-300 dark:border-stone-700 text-stone-400 text-[10px]">·</span>;
  return (
    <span title={p.name} style={{width:size,height:size,fontSize: size>=28? 11 : 9.5}}
      className={`${p.av} inline-flex items-center justify-center rounded-full text-white font-medium ${ring?'ring-2 ring-white dark:ring-stone-900':''}`}>
      {p.initials}
    </span>
  );
}
function AvatarStack({ people, max=4, size=20 }) {
  const visible = people.slice(0,max), more = people.length - visible.length;
  return (
    <div className="flex -space-x-1.5">
      {visible.map((p,i) => <Avatar key={i} p={p} size={size} ring />)}
      {more > 0 && (
        <span style={{width:size,height:size,fontSize: 9.5}}
          className="rounded-full bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-300 inline-flex items-center justify-center font-medium ring-2 ring-white dark:ring-stone-900">
          +{more}
        </span>
      )}
    </div>
  );
}
function Toggle({ on, onChange, label }) {
  return (
    <button onClick={()=>onChange(!on)} className={`inline-flex items-center gap-2 text-xs ${on?'text-indigo-600 dark:text-indigo-400':'text-stone-500'}`}>
      <span className={`w-7 h-4 rounded-full p-0.5 transition-colors ${on?'bg-indigo-600':'bg-stone-300 dark:bg-stone-700'}`}>
        <span className={`block w-3 h-3 rounded-full bg-white transition-transform ${on?'translate-x-3':''}`} />

      {label}
    </button>

}
function Sep(){ return <span className="text-stone-300 dark:text-stone-700">·</span>; }

/* =========================================================================
   TWEAKS PANEL (host integration)
========================================================================= */
function useTweaks() {
  const [t, setT] = useState(() => {
    try { return { ...TWEAK_DEFAULTS, ...(JSON.parse(localStorage.getItem('spt-tweaks')||'{}')) }; }
    catch { return TWEAK_DEFAULTS; }
  });
  useEffect(()=>{ localStorage.setItem('spt-tweaks', JSON.stringify(t)); }, [t]);
  const set = (patch) => {
    setT(prev => ({...prev, ...patch}));
    try { window.parent?.postMessage({type:'__edit_mode_set_keys', edits: patch}, '*'); } catch {}
  };
  return [t, set];
}
function TweaksPanel({ open, t, set, onClose }) {
  if (!open) return null;
  const Row = ({label, children}) => (
    <div className="grid grid-cols-[100px_1fr] items-center gap-3 text-xs">
      <span className="text-stone-500 dark:text-stone-400">{label}</span>
      <div className="flex flex-wrap gap-1">{children}</div>
    </div>
  );
  const Btn = ({active, ...p}) => (
    <button {...p} className={`px-2 py-1 rounded-md border text-[11px] font-medium transition-colors ${active ? 'bg-stone-900 text-white border-stone-900 dark:bg-white dark:text-stone-900 dark:border-white' : 'bg-white dark:bg-stone-900 border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-300 hover:border-stone-400'}`}/>
  );
  const accents = [
    ['indigo','#6366f1'], ['violet','#8b5cf6'], ['emerald','#059669'],
    ['rose','#e11d48'], ['amber','#d97706'], ['stone','#0c0a09']
  ];
  return (
    <div className="fixed bottom-4 right-4 z-50 w-[320px] rounded-xl border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-950 shadow-xl">
      <div className="flex items-center justify-between px-3 py-2 border-b border-stone-200 dark:border-stone-800">
        <div className="flex items-center gap-2 text-xs font-medium">
          <span className="w-1.5 h-1.5 rounded-full bg-indigo-500" /> Tweaks
        </div>
        <button onClick={onClose} className="text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 text-sm leading-none">×</button>
      </div>
      <div className="p-3 space-y-3">
        <Row label="Variation">
          <Btn active={t.variation==='A'} onClick={()=>set({variation:'A'})}>A · Focus</Btn>
          <Btn active={t.variation==='B'} onClick={()=>set({variation:'B'})}>B · Command</Btn>
        </Row>
        <Row label="Theme">
          <Btn active={t.theme==='light'} onClick={()=>set({theme:'light'})}>Light</Btn>
          <Btn active={t.theme==='dark'} onClick={()=>set({theme:'dark'})}>Dark</Btn>
        </Row>
        <Row label="Screen">
          {[['board','Board'],['list','Projects'],['story','Story'],['task','Task'],['login','Login'],['settings','Settings'],['invites','Invites']].map(([id,l])=>(
            <Btn key={id} active={t.screen===id} onClick={()=>set({screen:id})}>{l}</Btn>
          ))}
        </Row>
        <Row label="Density">
          <Btn active={t.density==='compact'} onClick={()=>set({density:'compact'})}>Compact</Btn>
          <Btn active={t.density==='balanced'} onClick={()=>set({density:'balanced'})}>Balanced</Btn>
          <Btn active={t.density==='spacious'} onClick={()=>set({density:'spacious'})}>Spacious</Btn>
        </Row>
        <Row label="Accent">
          {accents.map(([id,c]) => (
            <button key={id} title={id} onClick={()=>set({accent:id})}
              style={{background:c, outline: t.accent===id ? '2px solid currentColor':'1px solid rgba(0,0,0,.08)', outlineOffset: 1}}
              className="w-5 h-5 rounded-full" />
          ))}
        </Row>
      </div>
    </div>
  );
}

/* =========================================================================
   GLOBAL THEME WIRING
========================================================================= */
const ACCENTS = {
  indigo:  { hex:'#6366f1', soft:'#eef2ff', softDark:'#1e1b4b', text:'#4338ca', textDark:'#a5b4fc' },
  violet:  { hex:'#8b5cf6', soft:'#f5f3ff', softDark:'#2e1065', text:'#6d28d9', textDark:'#c4b5fd' },
  emerald: { hex:'#059669', soft:'#ecfdf5', softDark:'#022c22', text:'#047857', textDark:'#6ee7b7' },
  rose:    { hex:'#e11d48', soft:'#fff1f2', softDark:'#4c0519', text:'#be123c', textDark:'#fda4af' },
  amber:   { hex:'#d97706', soft:'#fffbeb', softDark:'#451a03', text:'#b45309', textDark:'#fcd34d' },
  stone:   { hex:'#0c0a09', soft:'#f5f5f4', softDark:'#1c1917', text:'#1c1917', textDark:'#e7e5e4' },
};
function ThemeStyle({ tweaks }) {
  const a = ACCENTS[tweaks.accent] || ACCENTS.indigo;
  return (
    <style>{`
      :root { --accent:${a.hex}; --accent-soft:${a.soft}; --accent-text:${a.text}; }
      .dark { --accent-soft:${a.softDark}; --accent-text:${a.textDark}; }
      .accent-bg { background: var(--accent); color:white; }
      .accent-bg:hover { filter: brightness(.95); }
      .accent-soft { background: var(--accent-soft); color: var(--accent-text); }
      .accent-text { color: var(--accent-text); }
      .accent-border { border-color: var(--accent); }
      .accent-ring { box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent); }
      .focus-ring:focus { outline:none; box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
    `}</style>
  );
}

========================================================================= */
const I = {
  search: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>,

/* =========================================================================
   APP SHELL — switches based on tweak.variation
========================================================================= */
function App() {
  const [tweaks, setTweaks] = useTweaks();
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [showCmdK, setShowCmdK] = useState(false);

  // host edit-mode wiring
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent?.postMessage({type:'__edit_mode_available'}, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // global hotkeys
  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setShowCmdK(o=>!o); }
      if (e.key === 'Escape') setShowCmdK(false);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const dark = tweaks.theme === 'dark';
  const Variation = tweaks.variation === 'B' ? VariationB : VariationA;

  return (
    <div className={dark ? 'dark' : ''}>
      <ThemeStyle tweaks={tweaks} />
      <div className="frame min-h-screen bg-stone-100 dark:bg-black text-stone-900 dark:text-stone-100">
        <Variation tweaks={tweaks} setTweaks={setTweaks} onCmdK={()=>setShowCmdK(true)} />
        {showCmdK && <CommandPalette onClose={()=>setShowCmdK(false)} setTweaks={setTweaks} />}
        <FloatingTweaksToggle open={tweaksOpen} setOpen={setTweaksOpen} />
        <TweaksPanel open={tweaksOpen} t={tweaks} set={setTweaks} onClose={()=>setTweaksOpen(false)} />
      </div>
    </div>
  );
}

function FloatingTweaksToggle({ open, setOpen }) {
  if (open) return null;
  return (
    <button onClick={()=>setOpen(true)}
      className="fixed bottom-4 right-4 z-40 px-3 py-1.5 rounded-full bg-stone-900 text-white text-[11px] shadow-lg hover:bg-stone-700 dark:bg-white dark:text-stone-900 dark:hover:bg-stone-200">
      Tweaks
    </button>
  );
}

/* =========================================================================
   COMMAND PALETTE (cmd-K) — mostly for variation B but available everywhere
========================================================================= */
function CommandPalette({ onClose, setTweaks }) {
  const [q, setQ] = useState('');
  const items = useMemo(() => [
    { type:'screen',  label:'Go to Board',         hint:'Project · Orbit Mobile App', do:()=>setTweaks({screen:'board'}) },
    { type:'screen',  label:'Go to Projects',      hint:'All projects',               do:()=>setTweaks({screen:'list'}) },
    { type:'screen',  label:'Go to Inbox',         hint:'Invitations + activity',     do:()=>setTweaks({screen:'invites'}) },
    { type:'screen',  label:'Open Story · ORB-12', hint:'Onboarding flow',            do:()=>setTweaks({screen:'story'}) },
    { type:'screen',  label:'Open Task · ORB-102', hint:'Permissions copy',           do:()=>setTweaks({screen:'task'}) },
    { type:'screen',  label:'Open Settings',                                        do:()=>setTweaks({screen:'settings'}) },
    { type:'action',  label:'Create new task',     hint:'in Onboarding flow',        do:()=>{} },
    { type:'action',  label:'Create new story',                                      do:()=>{} },
    { type:'action',  label:'Invite teammate',                                       do:()=>{} },
    { type:'theme',   label:'Toggle dark mode',                                      do:()=>setTweaks({ theme: document.documentElement.classList.contains('dark')?'light':'dark' }) },
    { type:'theme',   label:'Switch layout · Focus (A)',                            do:()=>setTweaks({variation:'A'}) },
    { type:'theme',   label:'Switch layout · Command (B)',                          do:()=>setTweaks({variation:'B'}) },
  ], [setTweaks]);
  const filtered = q ? items.filter(i => (i.label+' '+(i.hint||'')).toLowerCase().includes(q.toLowerCase())) : items;
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-[18vh] bg-black/30 backdrop-blur-[2px]" onClick={onClose}>
      <div className="w-[560px] max-w-[92vw] rounded-xl bg-white dark:bg-stone-950 shadow-2xl border border-stone-200 dark:border-stone-800 overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 px-4 py-3 border-b border-stone-200 dark:border-stone-800">
          <span className="text-stone-400">{I.search}</span>
          <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Type a command or search…" className="flex-1 bg-transparent outline-none text-sm placeholder:text-stone-400" />
          <kbd>esc</kbd>
        </div>
        <div className="max-h-[360px] overflow-y-auto py-1">
          {filtered.map((it,i) => (
            <button key={i} onClick={()=>{ it.do(); onClose(); }}
              className="w-full flex items-center gap-3 px-4 py-2 hover:bg-stone-50 dark:hover:bg-stone-900 text-left">
              <span className="w-6 h-6 rounded-md flex items-center justify-center bg-stone-100 dark:bg-stone-900 text-stone-500">
                {it.type==='screen' ? I.arrow : it.type==='action' ? I.plus : I.sparkle}
              </span>
              <span className="flex-1 min-w-0">
                <span className="text-sm">{it.label}</span>
                {it.hint && <span className="ml-2 text-xs text-stone-400">{it.hint}</span>}
              </span>
              <span className="text-[10px] text-stone-400 uppercase tracking-wide">{it.type}</span>
            </button>
          ))}
          {filtered.length===0 && (
            <div className="px-4 py-8 text-center text-sm text-stone-400">No matches</div>
          )}
        </div>
        <div className="flex items-center justify-between px-4 py-2 border-t border-stone-200 dark:border-stone-800 text-[11px] text-stone-500">
          <div className="flex items-center gap-2"><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>↵</kbd> select</div>
          <div className="flex items-center gap-1">{I.cmd}<kbd>K</kbd> to toggle</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
